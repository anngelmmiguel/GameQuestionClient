<div class="hero bg-base-200 min-h-screen">



    <form class="flex flex-col gap-4" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <h1 class="text-2xl font-montserrat font-bold text-secondary text-center mb-2">
            Registro de Jugador
        </h1>


        <div class="flex w-full flex-col lg:flex-row">

            <div class="card rounded-box grid  flex-grow place-items-center gap-2">

                <label class="input input-bordered input-primary flex items-center gap-2">
            <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 16 16"
                fill="currentColor"
                class="h-4 w-4 opacity-70">
                <path
                d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM12.735 14c.618 0 1.093-.561.872-1.139a6.002 6.002 0 0 0-11.215 0c-.22.578.254 1.139.872 1.139h9.47Z" />
            </svg>
            <input type="text" class="grow" placeholder="Nombres" formControlName="name"/>
            </label>
                <label class="input input-bordered input-primary flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 9h3.75M15 12h3.75M15 15h3.75M4.5 19.5h15a2.25 2.25 0 0 0 2.25-2.25V6.75A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25v10.5A2.25 2.25 0 0 0 4.5 19.5Zm6-10.125a1.875 1.875 0 1 1-3.75 0 1.875 1.875 0 0 1 3.75 0Zm1.294 6.336a6.721 6.721 0 0 1-3.17.789 6.721 6.721 0 0 1-3.168-.789 3.376 3.376 0 0 1 6.338 0Z" />
            </svg>


            <input type="number" class="grow" placeholder="Identificación" formControlName="identification"/>
            </label>

                <label class="input input-bordered input-primary flex items-center gap-2">
            <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 16 16"
                fill="currentColor"
                class="h-4 w-4 opacity-70">
                <path
                fill-rule="evenodd"
                d="M14 6a4 4 0 0 1-4.899 3.899l-1.955 1.955a.5.5 0 0 1-.353.146H5v1.5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5v-2.293a.5.5 0 0 1 .146-.353l3.955-3.955A4 4 0 1 1 14 6Zm-4-2a.75.75 0 0 0 0 1.5.5.5 0 0 1 .5.5.75.75 0 0 0 1.5 0 2 2 0 0 0-2-2Z"
                clip-rule="evenodd" />
            </svg>
            <input type="password" class="grow" value="password" placeholder="Contraseña" formControlName="password"/>
            </label>

            </div>
            <div class="divider divider-horizontal divider-default"></div>
            <!--divider-->
            <div class="card rounded-box flex-grow place-items-start gap-2">

                <label class="input input-bordered input-primary flex items-center gap-2">
            <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 16 16"
                fill="currentColor"
                class="h-4 w-4 opacity-70">
                <path
                d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM12.735 14c.618 0 1.093-.561.872-1.139a6.002 6.002 0 0 0-11.215 0c-.22.578.254 1.139.872 1.139h9.47Z" />
            </svg>
            <input type="text" class="grow" placeholder="Apellidos" formControlName="lastName"/>
            </label>
                <label class="input input-bordered input-primary flex items-center gap-2">
            <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 16 16"
                fill="currentColor"
                class="h-4 w-4 opacity-70">
                <path
                d="M2.5 3A1.5 1.5 0 0 0 1 4.5v.793c.026.009.051.02.076.032L7.674 8.51c.206.1.446.1.652 0l6.598-3.185A.755.755 0 0 1 15 5.293V4.5A1.5 1.5 0 0 0 13.5 3h-11Z" />
                <path
                d="M15 6.954 8.978 9.86a2.25 2.25 0 0 1-1.956 0L1 6.954V11.5A1.5 1.5 0 0 0 2.5 13h11a1.5 1.5 0 0 0 1.5-1.5V6.954Z" />
            </svg>
            <input type="text" class="grow" placeholder="Email" formControlName="email"/>
            </label>
                <p class="text-info text-xs italic">La contraseña: Minimo 8 caracteres.<br/>Al menos una letra mayuscula y una minuscula.<br/>Al menos un digito y un caracter especial.</p>
            </div>

        </div>

        <button type="submit" class="btn btn-secondary w-full">Crear Cuenta 
            @if (isLoadingReg()) {
                <span class="loading loading-spinner"></span>
            }            
        </button>

        <p class="text-default">
            Ya tienes una cuenta.
            <a routerLink="/auth/login" class="text-accent">Ingresa aquí</a>
        </p>
    </form>

    @if (isLoading()) {
    <div style="text-align: center;"><span class="loading loading-spinner loading-lg"></span></div>
    }

    <!---->

    @if(hasError()){
    <div role="alert" class="alert alert-error animate-fadeIn fixed bottom-5 right-5 btn-wide">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 stroke-current" fill="none" viewBox="0 0 24 24">
                <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        <span>Datos Incorrectos</span>
    </div>
    }


    <!-- <p class="text-sm fixed bottom-5 left-5 italic">Desarrollado por Miguel Angel Rodríguez</p> -->
</div>
